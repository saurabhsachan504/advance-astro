services:
  web:
    build: ./apps/web
    environment:
      # Browser requests use the same-origin /api proxy; never expose the API port directly.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      # aaPanel/Caddy/Nginx should proxy to this loopback-only port and terminate HTTPS.
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started

  api:
    build: ./services/api
    env_file: .env
    volumes:
      - ./data/ephemeris:/app/data/ephemeris:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - ./data/qdrant:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./data/minio:/data

  # Enable only after installing a local model image/weights for your GPU.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: --model ${LLM_MODEL}
  #   gpus: all


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-astro-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<0.31", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "pyswisseph>=2.10.3.2", "pytz>=2024.2", "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.35", "psycopg[binary]>=3.2.3", "cryptography>=43.0.1",
  "httpx>=0.27.2", "boto3>=1.35.34", "Pillow>=10.4"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

